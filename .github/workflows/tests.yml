name: Tests

on:
  push:
    branches: [main, "improvements/**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
